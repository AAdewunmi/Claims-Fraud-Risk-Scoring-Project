# path: docker/docker-compose.prod.yml
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: policylens
      POSTGRES_USER: policylens
      POSTGRES_PASSWORD: policylens
    volumes:
      - policylens_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U policylens -d policylens"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.prod
    env_file:
      - ../.env
    environment:
      # Production mode for the service container.
      DJANGO_DEBUG: "0"

      # Local smoke defaults for running behind Nginx on plain HTTP.
      # For real TLS termination, set these to 1 and set X-Forwarded-Proto=https at Nginx.
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
      DJANGO_CSRF_TRUSTED_ORIGINS: "http://localhost:8080"
      DJANGO_SECURE_SSL_REDIRECT: "0"
      DJANGO_SESSION_COOKIE_SECURE: "0"
      DJANGO_CSRF_COOKIE_SECURE: "0"

      # Default DB wiring for the production compose stack.
      DATABASE_URL: "postgresql://policylens:policylens@db:5432/policylens"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - policylens_staticfiles:/app/staticfiles
      - policylens_media:/app/media
      - policylens_artifacts:/app/artifacts
    expose:
      - "8000"

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - web
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - policylens_staticfiles:/staticfiles:ro
      - policylens_media:/media:ro

volumes:
  policylens_postgres_data:
  policylens_staticfiles:
  policylens_media:
  policylens_artifacts: