worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;

  upstream policylens_web {
    server web:8000;
  }

  # Shared proxy headers for Django behind Nginx.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  server {
    listen 80;
    server_name _;

    client_max_body_size 25m;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    location /static/ {
      alias /staticfiles/;
      expires 1h;
      add_header Cache-Control "public";
    }

    location /media/ {
      alias /media/;
      expires 1h;
      add_header Cache-Control "public";
    }

    # Explicit surface routing. Query strings are preserved by proxy_pass.
    location /api/ {
      include /etc/nginx/conf.d/proxy_params.conf;
      proxy_pass http://policylens_web;
    }
    location /login/ {
      include /etc/nginx/conf.d/proxy_params.conf;
      proxy_pass http://policylens_web;
    }
    location /console/ {
      include /etc/nginx/conf.d/proxy_params.conf;
      proxy_pass http://policylens_web;
    }
    location /reviewer/ {
      include /etc/nginx/conf.d/proxy_params.conf;
      proxy_pass http://policylens_web;
    }
    location /customer/ {
      include /etc/nginx/conf.d/proxy_params.conf;
      proxy_pass http://policylens_web;
    }
    location /ops/ {
      include /etc/nginx/conf.d/proxy_params.conf;
      proxy_pass http://policylens_web;
    }

    # Root and fallback.
    location = / {
      include /etc/nginx/conf.d/proxy_params.conf;
      proxy_pass http://policylens_web;
    }
    location / {
      include /etc/nginx/conf.d/proxy_params.conf;
      proxy_pass http://policylens_web;
    }
  }

  # Inline proxy_params include so this config is self-contained in the repo.
  include /etc/nginx/conf.d/*.conf;
}
