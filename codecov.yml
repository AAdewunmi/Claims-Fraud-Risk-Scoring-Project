codecov:
  # Prevent status deadlocks where Codecov waits on CI/check contexts
  # that include Codecov itself.
  require_ci_to_pass: false

coverage:
  status:
    project:
      default:
        flags:
          - unittests
        target: 80%
        threshold: 0%
        if_ci_failed: error
    patch:
      default:
        flags:
          - unittests
        target: 80%
        # Allow a small buffer for diff-level coverage noise on tiny changes.
        threshold: 1%
        if_ci_failed: error
