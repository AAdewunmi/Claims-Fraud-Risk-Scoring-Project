<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}PolicyLens{% endblock %}</title>

    {% load static %}
    <link rel="stylesheet" href="{% static 'site/site.css' %}" />
  </head>

  <body>
    <header class="site-header">
      <div class="container">
        <div class="brand">
          <a class="brand-link" href="/">PolicyLens</a>
          <span class="brand-sub">Insurance claims workflow prototype</span>
        </div>

        <nav class="nav">
          <a class="nav-link" href="/login/admin/">Admin</a>
          <a class="nav-link" href="/login/reviewer/">Reviewer</a>
          <a class="nav-link" href="/login/customer/">Customer</a>
        </nav>
      </div>
    </header>

    <main class="container">
      {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
      <div class="container">
        <small>Work in progress. Surfaces and access rules harden over the sprints.</small>
      </div>
    </footer>
  </body>
</html>
