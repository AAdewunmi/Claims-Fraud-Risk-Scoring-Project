<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}PolicyLens{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Source+Sans+3:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    {% load static %}
    <link rel="stylesheet" href="{% static 'site/site.css' %}" />
  </head>

  <body>
    <header class="site-header">
      <div class="container">
        <div class="brand">
          <a class="brand-link" href="/">PolicyLens</a>
          <span class="brand-sub">Insurance Claims Fraud Risk Scoring System</span>
        </div>
        {% block header_nav %}{% endblock %}
      </div>
    </header>

    <main class="container">
      {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
      <div class="container">
        <small>
          PolicyLens is a production claims operations platform with enforced access control, auditability, and
          reliability monitoring.
        </small>
      </div>
    </footer>
  </body>
</html>
