<!-- path: policylens/apps/ops/templates/ops/base.html -->
{% load static %}
<!doctype html>
<html lang="en-gb">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}PolicyLens Ops{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="" crossorigin="anonymous">
    <link rel="stylesheet" href="{% static 'ops/ops.css' %}">
    <script src="https://unpkg.com/htmx.org@1.9.12" integrity="" crossorigin="anonymous"></script>
  </head>
  <body class="bg-body-tertiary">
    <nav class="navbar navbar-expand-lg bg-white border-bottom">
      <div class="container-fluid">
        <a class="navbar-brand fw-semibold" href="{% url 'ops:queue' %}">PolicyLens Ops</a>
        <div class="ms-auto d-flex align-items-center gap-3">
          <a class="text-decoration-none" href="{% url 'ops:queue' %}">Queue</a>
          <span class="text-muted small">{{ request.user.username }}</span>
        </div>
      </div>
    </nav>

    <main class="container-fluid py-4">
      <div class="container-xxl">
        {% block content %}{% endblock %}
      </div>
    </main>

    <footer class="border-top bg-white">
      <div class="container-xxl py-3 small text-muted">
        PolicyLens, Ops workflow platform
      </div>
    </footer>
  </body>
</html>
